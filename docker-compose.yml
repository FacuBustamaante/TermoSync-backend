services:
  mongodb:
    image: mongo:7.0
    container_name: iot_mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Opcional: Interfaz gráfica web para ver tu base de datos
  mongo-express:
    image: mongo-express:1.0.2
    container_name: iot_mongo_ui
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data: